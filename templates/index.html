<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crypto Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #1e1e2f;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .container {
            background: #2c2c3e;
            padding: 20px;
            border-radius: 10px;
            width: 500px;
            margin: auto;
        }

        input, select {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        table {
            margin-top: 20px;
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #444;
        }

        th {
            background: #3a3a5a;
        }
    </style>
</head>

<body>

<h1>Crypto Dashboard</h1>

<div class="container">

    <input id="coins" value="bitcoin,ethereum" placeholder="Coins">
    <input id="days" value="30" placeholder="Days">

    <select id="currency">
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="uah">UAH</option>
    </select>

    <br><br>

    <button onclick="loadData()">Load Data</button>

    <table id="table">
        <thead>
            <tr>
                <th>Coin</th>
                <th>Date</th>
                <th>Price</th>
                <th>Currency</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

</div>

<script src="/static/script.js"></script>

</body>
</html>
