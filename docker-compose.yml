version: '3.8'

services:
  crypto-api:
    build: .
    container_name: crypto_api_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=BitcoinApiProject.py
      - DATABASE_URL=sqlite:///instance/crypto_cache.db
      - CACHE_TIMEOUT=3600
    volumes:
      - ./instance:/app/instance
      - ./.env:/app/.env
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  crypto-network:
    driver: bridge

volumes:
  db-data:
